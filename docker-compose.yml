# Local MongoDB for development: single-node replica set (Prisma needs one).
services:
  mongo:
    image: mongo:7.0
    container_name: macnet-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - macnet-mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --port 27018 --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27018'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s
    restart: unless-stopped
volumes:
  macnet-mongo-data:
